<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工单追踪 · AIOps</title>
<style>
  :root{--bg:#0b1020;--panel:#121a2e;--line:#22304d;--text:#dbe6ff;--dim:#7d8db3;
        --accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--purple:#a78bfa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0e1730,#0b1020)}
  h1{font-size:18px;margin:0}
  h1 span{color:var(--accent)}
  .nav{display:flex;align-items:center;gap:10px;font-size:13px}
  .nav a{color:var(--accent);text-decoration:none;padding:5px 12px;border:1px solid var(--line);border-radius:7px}
  .nav a:hover{border-color:var(--accent);background:#17223c}
  .meta{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:16px 22px;height:calc(100vh - 60px)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .panel h2{margin:0;padding:12px 16px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);font-weight:600}
  .list{overflow:auto;flex:1}
  .item{padding:10px 14px;border-bottom:1px solid #1b2540;cursor:pointer}
  .item:hover{background:#17223c}
  .item.active{background:#1b2a4a;border-left:3px solid var(--accent)}
  .item .tid{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#a9bbd9}
  .item .sub{font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--purple);display:inline-block}
  .detail{overflow:auto;flex:1;padding:16px 20px}
  .tl{position:relative;margin-left:8px;padding-left:20px;border-left:2px solid #22304d}
  .ev{position:relative;margin-bottom:14px}
  .ev::before{content:'';position:absolute;left:-27px;top:5px;width:10px;height:10px;border-radius:50%;
              background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .ev.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .ev.warn::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .ev.bad::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .ev .when{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#5b6b8c}
  .ev .name{font-weight:600;font-size:13px;margin-left:8px}
  .ev .body{margin-top:4px;color:#a9bbd9;font-size:12.5px}
  details{margin-top:6px;background:#0e1730;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  summary{cursor:pointer;color:var(--accent);font-size:12.5px}
  pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-all;font:12px/1.55 ui-monospace,Consolas,monospace;
      max-height:360px;overflow:auto;color:#c8d6f0}
  .empty{color:var(--dim);padding:20px;text-align:center}
  .pill{font-size:11px;padding:1px 8px;border-radius:999px;background:#22304d;color:#a9bbd9}
</style>
</head>
<body>
<header>
  <h1>AIOps <span>工单追踪</span></h1>
  <div class="nav">
    <a href="/ops">大屏</a>
    <a href="/logs">日志</a>
    <a href="/approve">审核</a>
    <span class="meta" id="meta">加载中…</span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>最近工单（点击查看全链路）</h2>
    <div class="list" id="list"><div class="empty">加载中…</div></div>
  </section>

  <section class="panel">
    <h2 id="detailTitle">时间线</h2>
    <div class="detail" id="detail"><div class="empty">← 左侧选一个工单</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur = null;

function cls(ev, d){
  const e = ev || '';
  if(/resolved|notified|worker_result/.test(e)) return 'ok';
  if(/failed|error|escalated|violation/.test(e)) return 'bad';
  if(/accepted|enqueued|dispatched|invoked/.test(e)) return 'warn';
  return '';
}

function fmtTime(s){ return (s || '').slice(11, 19); }

async function loadList(){
  try{
    const r = await fetch('/api/traces?limit=60', {cache:'no-store'});
    const items = await r.json();
    $('meta').textContent = `共 ${items.length} 条追踪`;
    if(!items.length){ $('list').innerHTML = '<div class="empty">暂无追踪</div>'; return; }
    $('list').innerHTML = items.map(it => `
      <div class="item ${it.ticket_id === cur ? 'active' : ''}" onclick="pick('${esc(it.ticket_id)}')">
        <div class="tid">${esc((it.ticket_id || '').replace('tk-', '').slice(0, 18))}</div>
        <div class="sub">
          <span class="pill">${esc(it.signature)}</span>
          <span>${it.events} 事件</span>
          ${it.has_model ? '<span class="dot" title="含模型调用"></span>' : ''}
        </div>
      </div>`).join('');
  }catch(e){
    $('list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

async function pick(tid){
  cur = tid;
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('active',
    el.querySelector('.tid') && el.getAttribute('onclick').includes(tid)));
  $('detailTitle').textContent = `时间线 · ${tid}`;
  $('detail').innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch('/api/trace/' + encodeURIComponent(tid), {cache:'no-store'});
    const d = await r.json();
    if(d.error){ $('detail').innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    const tl = d.timeline || [];
    $('detail').innerHTML = `<div class="tl">${tl.map(e => renderEvent(e)).join('')}</div>`;
    loadList();
  }catch(e){
    $('detail').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

function renderEvent(e){
  const ev = e.event || '';
  let body = '';
  if(ev === 'dispatched'){
    body = `派给 <b style="color:var(--accent)">${esc(e.worker)} ${esc(e.worker_name || '')}</b>`
         + (e.queue_wait_s !== undefined ? `　排队等待 <b>${e.queue_wait_s}s</b>` : '');
  } else if(ev === 'enqueued' || ev === 'queue.enqueue'){
    body = `优先级 <b>${esc(e.priority || '-')}</b>`;
  } else if(ev === 'worker_invoked'){
    body = `模型调用　<code>${esc(e.model_cmd || '')}</code>`;
    if(e.prompt){
      body += `<details><summary>入参 · 完整提示词（${String(e.prompt).length} 字）</summary><pre>${esc(e.prompt)}</pre></details>`;
    }
  } else if(ev === 'worker_result'){
    body = `退出码 <b>${e.exit}</b>　耗时 <b>${e.duration_s}s</b>`;
    if(e.output){
      body += `<details><summary>出参 · 模型输出（${String(e.output).length} 字）</summary><pre>${esc(e.output)}</pre></details>`;
    }
    if(e.stderr){
      body += `<details><summary>stderr（${String(e.stderr).length} 字）</summary><pre>${esc(e.stderr)}</pre></details>`;
    }
  } else if(ev === 'notified'){
    body = e.text
      ? `<details><summary>飞书消息内容</summary><pre>${esc(e.text)}</pre></details>`
      : '已发送飞书通知';
  } else if(ev === 'resolved' || ev === 'escalated'){
    body = `<span>${esc((e.result || '').slice(0, 300))}</span>`;
  } else {
    const rest = Object.entries(e).filter(([k]) => !['at', 'event'].includes(k));
    if(rest.length) body = rest.map(([k, v]) => `${esc(k)}=${esc(typeof v === 'object' ? JSON.stringify(v) : v)}`).join('　');
  }
  return `<div class="ev ${cls(ev, e)}">
    <span class="when">${fmtTime(e.at)}</span><span class="name">${esc(ev)}</span>
    ${body ? `<div class="body">${body}</div>` : ''}
  </div>`;
}

loadList();
setInterval(loadList, 5000);
</script>
</body>
</html>
