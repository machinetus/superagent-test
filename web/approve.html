<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码变更审核 · AIOps</title>
<style>
  :root{--bg:#0b1020;--panel:#121a2e;--line:#22304d;--text:#dbe6ff;--dim:#7d8db3;
        --ok:#22c55e;--bad:#ef4444;--accent:#38bdf8;--add:#14532d;--del:#7f1d1d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0e1730,#0b1020)}
  h1{font-size:18px;margin:0}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:12px}
  main{max-width:1100px;margin:20px auto;padding:0 22px;display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card h2{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600}
  pre{margin:0;background:#0e1730;border:1px solid var(--line);border-radius:8px;padding:12px;
      overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;max-height:420px;white-space:pre-wrap;word-break:break-all}
  .commits{display:flex;flex-direction:column;gap:6px}
  .commit{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#a9bbd9;
          background:#0e1730;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .add{background:var(--add);color:#bbf7d0}
  .del{background:var(--del);color:#fecaca}
  .hunk{color:#7dd3fc}
  .actions{display:flex;gap:12px;align-items:center}
  button{cursor:pointer;border:1px solid var(--line);background:#17223c;color:var(--text);
         padding:10px 20px;border-radius:8px;font-size:14px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:linear-gradient(90deg,#0ea5e9,#6366f1);border:none;color:#fff;font-weight:600}
  #msg{color:var(--dim);font-size:13px}
  .warn{color:#fca5a5}
  .okmsg{color:#86efac}
</style>
</head>
<body>
<header>
  <h1>代码变更 <span>审核</span></h1>
  <div class="meta" id="meta">加载中…</div>
</header>
<main>
  <div class="card" id="approvalCard" style="display:none">
    <h2>待确认的高危操作（未批准不会执行）</h2>
    <div id="approvals"></div>
  </div>
  <div class="card">
    <h2>待应用提交（仓库 origin/main，尚未部署）</h2>
    <div class="commits" id="commits"><div class="meta">加载中…</div></div>
  </div>

  <div class="card">
    <h2>文件变更统计</h2>
    <pre id="stat">加载中…</pre>
  </div>

  <div class="card">
    <h2>完整 Diff</h2>
    <pre class="diff" id="diff">加载中…</pre>
  </div>

  <div class="card actions">
    <button class="primary" id="applyBtn" onclick="apply()">✓ 确认应用</button>
    <button onclick="location.href='/ops'">返回大屏</button>
    <span id="msg"></span>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function colorize(diff){
  return diff.split('\n').map(l => {
    if (l.startsWith('+++') || l.startsWith('---')) return esc(l);
    if (l.startsWith('@@')) return `<span class="hunk">${esc(l)}</span>`;
    if (l.startsWith('+')) return `<span class="add">${esc(l)}</span>`;
    if (l.startsWith('-')) return `<span class="del">${esc(l)}</span>`;
    return esc(l);
  }).join('\n');
}

async function load(){
  try{
    const r = await fetch('/api/git/pending', {cache:'no-store'});
    const d = await r.json();
    if(!d.ok){
      $('meta').textContent = '检测失败';
      $('commits').innerHTML = `<div class="warn">${esc(d.error || '未知错误')}</div>`;
      $('applyBtn').disabled = true;
      return;
    }
    $('meta').textContent = `基准 ${d.deployed.slice(0,8)} → 目标 ${d.target}`;
    const cs = d.commits || [];
    $('commits').innerHTML = cs.length
      ? cs.map(c => `<div class="commit">${esc(c)}</div>`).join('')
      : '<div class="okmsg">没有待应用的变更，运行实例已是最新。</div>';
    $('stat').textContent = d.stat || '（无文件变更）';
    $('diff').innerHTML = d.diff ? colorize(d.diff) : '（无 diff）';
    if(!cs.length){
      $('applyBtn').disabled = true;
      $('applyBtn').textContent = '已是最新';
    }
  }catch(e){
    $('meta').textContent = '无法连接 Router';
    $('commits').innerHTML = `<div class="warn">${esc(e.message)}</div>`;
  }
}

async function apply(){
  if(!confirm('确认把仓库最新代码应用到运行实例？\n（会同步 order_app.py / web/*.html 并重启服务）')) return;
  $('applyBtn').disabled = true;
  $('applyBtn').textContent = '应用中…';
  $('msg').textContent = '正在同步并重启…';
  try{
    const r = await fetch('/api/git/apply', {method:'POST'});
    const d = await r.json();
    $('msg').innerHTML = d.ok
      ? `<span class="okmsg">✓ ${esc(d.message)}</span>`
      : `<span class="warn">✗ ${esc(d.message)}</span>`;
    $('applyBtn').textContent = d.ok ? '已应用' : '应用失败';
    if(d.ok) setTimeout(load, 1200);
  }catch(e){
    $('msg').innerHTML = `<span class="warn">请求失败：${esc(e.message)}</span>`;
  }
}

async function loadApprovals(){
  try{
    const r = await fetch('/api/approvals', {cache:'no-store'});
    const items = await r.json();
    const card = document.getElementById('approvalCard');
    if(!items.length){ card.style.display = 'none'; return; }
    card.style.display = '';
    document.getElementById('approvals').innerHTML = items.map(it => `
      <div class="commit" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <b style="color:#fca5a5">${esc(it.signature)}</b> · ${esc(it.service || '-')}
          · 发起人 ${esc(it.sender || '-')} · 剩余 ${it.remaining_s}s
          <div style="color:#5b6b8c;font-size:11px">${esc(it.ticket_id)}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="decide('${esc(it.ticket_id)}','approve')">批准</button>
          <button onclick="decide('${esc(it.ticket_id)}','reject')">拒绝</button>
        </div>
      </div>`).join('');
  }catch(e){ /* 忽略 */ }
}

async function decide(tid, decision){
  const r = await fetch('/api/approve/' + encodeURIComponent(tid), {
    method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify({decision})
  });
  const d = await r.json();
  if(!d.ok){ alert(d.message || '操作失败'); }
  loadApprovals();
}

load();
loadApprovals();
setInterval(loadApprovals, 5000);
</script>
</body>
</html>
